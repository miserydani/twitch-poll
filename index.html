<!doctype html>
<html lang="es">
<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>WoW Twitch Poll</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
}

body{
  font-family:Georgia,"Times New Roman",serif;
}

.wow-poll{
  width:100%;
  height:100%;
  padding:12px;
}

.frame{
  position:relative;
  width:100%;
  min-height:100px;
  padding:9px;

  background:
    linear-gradient(
      135deg,
      #171512,
      #4b4437 7%,
      #171513 13%,
      #292722 50%,
      #151411 87%,
      #514a3d
    );

  border:2px solid #11100e;
  border-radius:5px;

  box-shadow:
    0 0 0 1px #756a55,
    0 0 0 3px #211e19,
    0 4px 8px rgba(0,0,0,.8);
}

.frame:before{
  content:"";
  position:absolute;
  inset:4px;
  border:1px solid #887b60;
  pointer-events:none;
}

.frame:after{
  content:"";
  position:absolute;
  inset:7px;
  border:1px solid #0b0a08;
  pointer-events:none;
}

.frame-inner{
  position:relative;

  padding:38px 22px 18px;

  background:
    linear-gradient(
      180deg,
      #cdb98d 0%,
      #b69a68 48%,
      #a98b5b 100%
    );

  border:2px solid #3a2b1b;

  box-shadow:
    inset 0 0 0 1px #e0c997,
    inset 0 0 15px rgba(54,33,14,.55);

  border-radius:2px;
}

.title-plate{
  position:absolute;
  top:-14px;
  left:50%;
  transform:translateX(-50%);

  width:225px;
  height:43px;
  padding:3px;

  background:
    linear-gradient(
      180deg,
      #0e0d0b,
      #625943 45%,
      #181612
    );

  border:2px solid #16130f;
  border-radius:5px;

  box-shadow:
    0 1px 0 #a49470,
    0 2px 5px rgba(0,0,0,.8);
}

.title-plate:before{
  content:"";
  position:absolute;
  inset:3px;
  border:1px solid #776b52;
  pointer-events:none;
}

.title-text{
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#e8c96d;

  font-size:22px;
  font-weight:bold;

  text-shadow:
    0 1px 2px #000,
    0 0 2px #000;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

  padding:0 10px;
}

.options{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.poll-option{
  position:relative;

  height:48px;

  overflow:hidden;

  background:
    linear-gradient(
      180deg,
      #260606 0%,
      #680b0b 47%,
      #3d0505 100%
    );

  border:2px solid #160b08;
  border-radius:4px;

  box-shadow:
    inset 0 1px 0 rgba(255,219,161,.38),
    inset 0 -2px 3px rgba(0,0,0,.8),
    0 1px 1px rgba(0,0,0,.7);
}

.poll-option:before{
  content:"";
  position:absolute;
  inset:2px;

  border:1px solid #a77b49;
  border-radius:2px;

  opacity:.7;
  pointer-events:none;
}

.poll-option:after{
  content:"";
  position:absolute;

  left:3px;
  right:3px;
  top:3px;

  height:1px;

  background:rgba(255,218,166,.32);

  pointer-events:none;
}

.fill{
  position:absolute;

  left:0;
  top:0;
  bottom:0;

  width:0%;

  background:
    linear-gradient(
      180deg,
      #e0b64d 0%,
      #b77b20 42%,
      #70430e 100%
    );

  box-shadow:
    inset 0 1px 0 rgba(255,235,157,.75),
    inset 0 -2px 4px rgba(45,24,4,.6),
    0 0 6px rgba(215,164,57,.25);

  transition:
    width .45s cubic-bezier(.2,.75,.25,1);
}

.fill:after{
  content:"";

  position:absolute;

  right:0;
  top:0;
  bottom:0;

  width:3px;

  background:rgba(255,231,142,.7);

  box-shadow:
    0 0 5px rgba(255,214,90,.75);
}

.option-content{
  position:relative;
  z-index:2;

  height:100%;

  display:flex;
  align-items:center;

  padding:0 9px;
}

.number{
  width:30px;
  height:30px;

  flex:0 0 30px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      180deg,
      #d7bf88,
      #927445 48%,
      #67502f
    );

  border:1px solid #332412;
  border-radius:3px;

  box-shadow:
    inset 0 1px 0 #f0dcac,
    0 1px 2px #000;

  color:#20160d;

  font-size:16px;
  font-weight:bold;

  text-shadow:0 1px #dfc58e;
}

.name{
  flex:1;
  min-width:0;

  margin-left:11px;

  color:#f0e1c3;

  font-size:18px;
  font-weight:bold;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

  text-shadow:
    1px 1px 2px #000,
    -1px -1px 0 rgba(0,0,0,.45);
}

.percent{
  width:62px;

  text-align:right;

  color:#f1ddb0;

  font-size:15px;
  font-weight:bold;

  text-shadow:1px 1px 2px #000;
}

.bottom-line{
  height:3px;

  margin:15px 4px 12px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #5d472a 15%,
      #d0b16c 50%,
      #5d472a 85%,
      transparent
    );

  box-shadow:
    0 1px 0 rgba(255,230,176,.35);
}

.footer{
  display:flex;
  justify-content:space-between;

  padding:0 5px;

  color:#302415;

  font-size:13px;
  font-weight:bold;

  text-shadow:
    0 1px rgba(237,211,158,.55);
}

.footer b{
  color:#19130d;
}

.status{
  position:absolute;

  right:8px;
  bottom:3px;

  font-family:Arial,sans-serif;

  font-size:8px;

  color:#645238;

  opacity:.75;
}

.status.live{
  color:#416b37;
}

.status.error{
  color:#762e25;
}

.status.ended{
  color:#3c3021;
}

</style>

</head>

<body>

<div class="wow-poll">

  <div class="frame">

    <div class="frame-inner">

      <div class="title-plate">

        <div
          class="title-text"
          id="question"
        >
          ¿Qué debería jugar?
        </div>

      </div>

      <div
        id="options"
        class="options"
      ></div>

      <div class="bottom-line"></div>

      <div class="footer">

        <span>
          Unique votes:
          <b id="votes">0</b>
        </span>

        <span>
          Time active:
          <b id="time">0:00</b>
        </span>

      </div>

      <div
        id="status"
        class="status"
      >
        ● CONNECTING
      </div>

    </div>

  </div>

</div>


<!--
==================================================
TMI.JS
CONEXIÓN ANÓNIMA
SIN TOKEN
SIN OAUTH
==================================================
-->

<script src="https://cdn.tmijs.org/js/latest/1.x/tmi.min.js"></script>


<script>

(function(){

"use strict";


/* =================================================
   VARIABLES DE POGly
================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const channel =
  (
    params.get("channel")
    ||
    "rubius"
  )
  .trim()
  .toLowerCase()
  .replace(/^#/,"");


const question =
  params.get("question")
  ||
  "¿Qué debería jugar?";


/* =================================================
   OPCIONES
================================================= */

const optionValues = [];


for(
  let i = 1;
  i <= 8;
  i++
){

  const value =
    (
      params.get(
        "option" + i
      )
      ||
      ""
    ).trim();


  if(value){

    optionValues.push(
      value
    );

  }

}


/* =================================================
   CONFIGURACIÓN
================================================= */

const DURATION =
  60000;

const COOLDOWN =
  500;


/* =================================================
   ELEMENTOS
================================================= */

const questionEl =
  document.getElementById(
    "question"
  );

const optionsEl =
  document.getElementById(
    "options"
  );

const votesEl =
  document.getElementById(
    "votes"
  );

const timeEl =
  document.getElementById(
    "time"
  );

const statusEl =
  document.getElementById(
    "status"
  );


/* =================================================
   PREGUNTA
================================================= */

questionEl.textContent =
  question;


/* =================================================
   VOTOS
================================================= */

const counts =
  new Array(
    optionValues.length
  ).fill(0);


const voters =
  new Set();


let total =
  0;


let lastVote =
  0;


let ended =
  false;


/* =================================================
   TIEMPO
================================================= */

const startedAt =
  Date.now();


/* =================================================
   CREAR FILAS
================================================= */

optionValues.forEach(
  function(
    name,
    index
  ){

    const row =
      document.createElement(
        "div"
      );


    row.className =
      "poll-option";


    row.innerHTML =

      '<div class="fill"></div>' +

      '<div class="option-content">' +

        '<div class="number">' +
          (index + 1) +
        '</div>' +

        '<div class="name"></div>' +

        '<div class="percent">' +
          '0.0%' +
        '</div>' +

      '</div>';


    row
      .querySelector(
        ".name"
      )
      .textContent =
      name;


    optionsEl.appendChild(
      row
    );

  }
);


const rows =
  Array.from(
    document.querySelectorAll(
      ".poll-option"
    )
  );


/* =================================================
   STATUS
================================================= */

function setStatus(
  text,
  className
){

  statusEl.textContent =
    text;

  statusEl.className =
    "status " +
    (
      className || ""
    );

}


/* =================================================
   RENDER
================================================= */

function render(){

  votesEl.textContent =
    String(total);


  rows.forEach(
    function(
      row,
      index
    ){

      const pct =
        total > 0
          ?
          (
            counts[index]
            /
            total
          ) * 100
          :
          0;


      row
        .querySelector(
          ".fill"
        )
        .style
        .width =
        pct + "%";


      row
        .querySelector(
          ".percent"
        )
        .textContent =
        pct.toFixed(1)
        + "%";

    }
  );

}


/* =================================================
   TERMINAR
================================================= */

function finish(){

  if(ended){
    return;
  }


  ended =
    true;


  timeEl.textContent =
    "1:00";


  setStatus(
    "● ENDED",
    "ended"
  );

}


/* =================================================
   RELOJ
================================================= */

function updateClock(){

  const elapsed =
    Date.now()
    -
    startedAt;


  if(
    elapsed >=
    DURATION
  ){

    finish();

    return;

  }


  const seconds =
    Math.floor(
      elapsed / 1000
    );


  const minutes =
    Math.floor(
      seconds / 60
    );


  const remaining =
    seconds % 60;


  timeEl.textContent =
    minutes
    +
    ":"
    +
    (
      remaining < 10
        ? "0"
        : ""
    )
    +
    remaining;

}


/* =================================================
   VOTO
================================================= */

function acceptVote(
  userId,
  number
){

  if(ended){
    return;
  }


  if(!userId){
    return;
  }


  /*
    Un voto por usuario.
  */

  if(
    voters.has(
      userId
    )
  ){

    return;

  }


  /*
    Anti-spam.
  */

  const now =
    Date.now();


  if(
    now -
    lastVote
    <
    COOLDOWN
  ){

    return;

  }


  /*
    La opción tiene
    que existir.
  */

  if(
    number < 1
    ||
    number > rows.length
  ){

    return;

  }


  voters.add(
    userId
  );


  counts[
    number - 1
  ]++;


  total++;


  lastVote =
    now;


  render();

}


/* =================================================
   ESTADO INICIAL
================================================= */

render();

setStatus(
  "● CONNECTING",
  ""
);


/* =================================================
   CONEXIÓN TMI
================================================= */

function connectTwitch(){

  /*
    Comprobar que la librería
    cargó correctamente.
  */

  if(
    typeof window.tmi ===
    "undefined"
  ){

    setStatus(
      "● TMI NOT LOADED",
      "error"
    );

    return;

  }


  /*
    CONEXIÓN ANÓNIMA.

    NO:

    identity
    oauth
    token

    Solo:

    channels
  */

  const client =
    new window.tmi.Client({

      channels:[
        channel
      ],

      options:{
        skipMembership:true,
        debug:false
      },

      connection:{
        secure:true,
        reconnect:true
      }

    });


  /* ===============================================
     CONNECTING
  =============================================== */

  client.on(
    "connecting",
    function(){

      if(!ended){

        setStatus(
          "● CONNECTING",
          ""
        );

      }

    }
  );


  /* ===============================================
     CONNECTED
  =============================================== */

  client.on(
    "connected",
    function(
      address,
      port
    ){

      if(!ended){

        setStatus(
          "● CHAT READY",
          "live"
        );

      }

    }
  );


  /* ===============================================
     MESSAGE
  =============================================== */

  client.on(
    "message",
    function(
      channelName,
      tags,
      message,
      self
    ){

      /*
        No contar mensajes
        generados por nosotros.
      */

      if(self){
        return;
      }


      if(ended){
        return;
      }


      /*
        Limpiar mensaje.
      */

      const text =
        String(
          message || ""
        ).trim();


      /*
        SOLO:

        1
        2
        3
        4
        5
        6
        7
        8
      */

      if(
        !/^[1-8]$/.test(
          text
        )
      ){

        return;

      }


      /*
        ID DE TWITCH.

        Preferimos user-id.

        Si el servidor anónimo
        no lo proporciona,
        utilizamos username
        como respaldo.
      */

      const userId =
        String(
          tags["user-id"]
          ||
          tags.username
          ||
          ""
        ).trim();


      if(!userId){
        return;
      }


      /*
        REGISTRAR VOTO.
      */

      acceptVote(
        userId,
        parseInt(
          text,
          10
        )
      );

    }
  );


  /* ===============================================
     DISCONNECTED
  =============================================== */

  client.on(
    "disconnected",
    function(){

      if(!ended){

        setStatus(
          "● RECONNECTING",
          "error"
        );

      }

    }
  );


  /* ===============================================
     ERROR
  =============================================== */

  client.on(
    "log",
    function(message){

      /*
        No mostramos todos los logs
        en pantalla porque ensuciarían
        el diseño.
      */

      console.log(
        "[TMI]",
        message
      );

    }
  );


  /* ===============================================
     CONECTAR
  =============================================== */

  client
    .connect()

    .then(
      function(){

        console.log(
          "[POLL] Twitch connected:",
          channel
        );

      }
    )

    .catch(
      function(error){

        console.error(
          "[POLL] Twitch connection error:",
          error
        );


        if(!ended){

          setStatus(
            "● CHAT ERROR",
            "error"
          );

        }

      }
    );

}


/* =================================================
   ESPERAR A QUE TMI CARGUE
================================================= */

if(
  typeof window.tmi !==
  "undefined"
){

  connectTwitch();

}

else{

  /*
    Esperar un poco por si
    el CDN todavía está cargando.
  */

  let attempts =
    0;


  const waitForTmi =
    setInterval(
      function(){

        attempts++;


        if(
          typeof window.tmi !==
          "undefined"
        ){

          clearInterval(
            waitForTmi
          );


          connectTwitch();

          return;

        }


        /*
          50 intentos × 100ms
          = 5 segundos.
        */

        if(
          attempts >= 50
        ){

          clearInterval(
            waitForTmi
          );


          setStatus(
            "● TMI NOT LOADED",
            "error"
          );

        }

      },
      100
    );

}


/* =================================================
   RELOJ
================================================= */

setInterval(
  updateClock,
  100
);


})();

</script>

</body>
</html>
